name: Release

# Every push to main publishes `@goldjee/news-digest-mcp` to the npm registry, and archives the same
# tarball on a GitHub release.
#
# The registry is the install contract, and the reason is not cosmetic. npm decides whether an
# already-installed npx package can be reused by comparing `node.package.resolved` against the
# manifest's `_resolved` — string equality on the resolved URL, not on content (see
# libnpmexec's `missingFromTree`). A fixed `releases/latest/download/…` URL therefore never
# re-installs: the string never changes, so a published fix reaches nobody who already ran it once.
# A registry spec resolves `@latest` to a versioned tarball whose URL does move, which is what makes
# `npx -y @goldjee/news-digest-mcp@latest` pick up a release.
#
# Publishing uses trusted publishing (OIDC): the `id-token: write` permission below lets npm
# authenticate this workflow directly, so there is no NPM_TOKEN secret to store or rotate — npm
# removed non-expiring tokens in November 2025. Provenance is generated automatically as a result.
#
# The artifact is JavaScript, not TypeScript, because Node refuses to strip types for anything
# under node_modules (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING). A package shipping raw .ts
# cannot run however it is installed. Developing from a clone still needs no build step.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write # mints the OIDC token that npm trusted publishing authenticates against

# Serialise, so two quick pushes can't race and leave the registry's `latest` on the older build.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14. Upgrading npm explicitly
            # rather than trusting the runner image means a bundled-npm downgrade can't silently
            # drop us below that and fall back to looking for a token that does not exist.
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm install -g npm@latest

            # The repo has bun.lock and no package-lock.json, so `npm ci` is not an option.
            - run: bun install --frozen-lockfile

            # Distinct and monotonic, because npm refuses to republish a version. The committed
            # 1.0.0 is what a manual publish ships; every CI release sits above it.
            - name: Set release version
              run: npm pkg set version="1.0.$GITHUB_RUN_NUMBER"

            # `npm pack` fires the `prepack` script, which runs the build — so the tarball can never
            # contain a stale `dist/`. `files` in package.json is what keeps src/ and the configs out.
            #
            # The bundle is one near-self-contained file: `--target=node` inlines every dependency,
            # leaving only node: builtins imported, so installing the result fetches 2 packages
            # instead of 129. bun carries the `#!/usr/bin/env node` shebang through to the output.
            #
            # jsonc-parser is the exception, and the only runtime dependency declared. It has no
            # `exports` map, so bun resolves its UMD `main` rather than the ESM `module`, and the UMD
            # wrapper does `require("./impl/format")` at runtime — a relative require that cannot
            # survive being bundled into one file. Keeping it external costs nothing: it has zero
            # dependencies of its own.
            - name: Pack
              run: |
                  # npm pack names the file after name@version; pin the asset name, which the
                  # GitHub release below still publishes under. `prepack` sends the build's output
                  # to stderr so that `--silent` really does leave only the filename on stdout.
                  mv "$(npm pack --silent)" news-digest-mcp.tgz

            # The bundler leaving a relative require behind means a package resolved to a CJS/UMD
            # entry that self-requires, as jsonc-parser does. It fails only when the bundle runs, so
            # catch it here where the error can name the cause.
            - name: Check for unresolved requires
              run: |
                  if grep -nE 'require[0-9]*\("\./' dist/server.js; then
                    echo "::error::bundle contains relative runtime requires; add the offending package to --external in the build script"
                    exit 1
                  fi

            # Install the tarball and drive the *installed* binary, not dist/server.js directly.
            # Running it from under node_modules is the whole point: that is the path that broke
            # before, and only this form would have caught it.
            - name: Smoke-test the packed artifact
              run: |
                  mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
                  npm init -y >/dev/null
                  npm install --no-fund --no-audit "$GITHUB_WORKSPACE/news-digest-mcp.tgz"
                  out=$(printf '%s\n' \
                    '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
                    '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                    '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
                    '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_sources","arguments":{}}}' \
                    | NEWS_DIGEST_CONFIG="$GITHUB_WORKSPACE/sources-template.jsonc" \
                      NEWS_DIGEST_STATE="$RUNNER_TEMP/state.json" \
                      ./node_modules/.bin/news-digest-mcp)
                  echo "$out"
                  echo "$out" | grep -q '"name":"get_news"' || { echo "::error::tools/list did not advertise get_news"; exit 1; }
                  echo "$out" | grep -q '"name":"list_sources"' || { echo "::error::tools/list did not advertise list_sources"; exit 1; }
                  # The dialect the tool schemas are announced under. The SDK stamps draft-07 and
                  # offers no way to configure it, so src/lib/dialect.ts corrects it at the transport;
                  # a client that validates 2020-12 only rejects both tools without it.
                  echo "$out" | grep -q '"\$schema":"https://json-schema.org/draft/2020-12/schema"' \
                    || { echo "::error::tool schemas do not declare the 2020-12 dialect; is src/lib/dialect.ts still wired into src/server.ts?"; exit 1; }
                  if echo "$out" | grep -q 'json-schema.org/draft-07'; then
                    echo "::error::a tool schema still declares draft-07; the dialect rewrite was bypassed"
                    exit 1
                  fi
                  # Declaring 2020-12 is only honest while the emitted bodies read the same under
                  # both dialects. zod-to-json-schema writes draft-07, so e.g. a z.tuple() added to
                  # src/lib/schema.ts would serialize as array-form `items` + `additionalItems`, which
                  # 2020-12 reads differently (it wants `prefixItems`). Fail the release instead.
                  if echo "$out" | grep -qE '"(prefixItems|additionalItems|definitions|\$defs|\$ref)"'; then
                    echo "::error::tool schema uses a construct whose meaning differs between draft-07 and 2020-12; see src/lib/dialect.ts"
                    exit 1
                  fi
                  # The tool call, not just the listing: this is what actually parses the config
                  # through jsonc-parser, so it proves the external dependency resolves at runtime.
                  echo "$out" | grep -q '"structuredContent":{"sources"' || { echo "::error::list_sources call returned no sources"; exit 1; }

            # After the smoke test, never before: only bytes that have been driven end to end ship.
            # No `env:` and no secret — OIDC covers authentication, and `--access public` is required
            # because a scoped package would otherwise default to restricted.
            - name: Publish to npm
              run: npm publish news-digest-mcp.tgz --access public

            # An archive of exactly what was published, one per commit. This is no longer an install
            # path: the fixed `releases/latest/download/` URL is precisely what npm will not
            # re-resolve, which is why the registry took over.
            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="build-$(git rev-parse --short HEAD)"
                  version="$(node -p 'require("./package.json").version')"
                  gh release create "$tag" news-digest-mcp.tgz \
                    --title "$tag" \
                    --notes "Built from ${GITHUB_SHA}, published as \`@goldjee/news-digest-mcp@${version}\`. Install: \`npx -y @goldjee/news-digest-mcp@latest\`"
